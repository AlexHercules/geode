[package]
name = "geode"
version = "0.22.0"
description = "Geode — a local-first markdown knowledge base"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# R218: reveal-in-system / open-in-default-app. Hard-boundary #5 (new runtime
# dependency) unlocked by the user 2026-06-25 for THIS plugin only — scope is
# vault files (reveal/open), never open_url/arbitrary URLs.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
ureq = "2"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
